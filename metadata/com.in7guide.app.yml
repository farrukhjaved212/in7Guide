Categories:
  - Internet
License: MIT
AuthorName: Farrukh Javed
SourceCode: https://github.com/farrukhjaved212/in7Guide
IssueTracker: https://github.com/farrukhjaved212/in7Guide/issues

RepoType: git
Repo: https://github.com/farrukhjaved212/in7Guide

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.44.4
    rm:
      - ios
      - .dart_tool
      - build
    build:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - $$flutter$$/bin/flutter build apk --release
